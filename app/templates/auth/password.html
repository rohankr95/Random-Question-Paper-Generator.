{% extends "base.html" %}{% from "_macros.html" import csrf %}
{% block content %}
<div class="card narrow">
  <h1>Change password</h1>
  <form method="post">{{ csrf() }}
    <label>Current password <input type="password" name="current" required></label>
    <label>New password (min 8 chars) <input type="password" name="new" minlength="8" required></label>
    <label>Confirm new password <input type="password" name="confirm" minlength="8" required></label>
    <button class="btn primary">Change password</button>
  </form>
</div>
{% endblock %}
